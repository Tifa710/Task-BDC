<section class="container pb-4">
  <div class="form-check form-switch my-3">
    <input
      class="form-check-input"
      type="checkbox"
      id="statusSwitch"
      [(ngModel)]="showIncompleteOnly"
      (change)="filterProjects()"
    />

    <label class="form-check-label" for="statusSwitch"> Show Complete Projects </label>
  </div>
  <div class="row">
    @for (project of filteredProjects; track project.id) {
      <div class="col-12 col-md-4 col-xl-3 mt-3 d-flex">
        <div class="card shadow h-100 w-100">
          <div class="card-header">
            <img class="w-100 rounded-2" [src]="project.projectImage" />
          </div>
          <div class="card-body">
            <h2>{{ project.name }}</h2>

            @if (isDeadlinePassed(project.deadLine)) {
              <p class="text-danger">Deadline Passed</p>
            }
            <time>
              Deadline:
              {{ project.deadLine | date: 'dd/MM/yyyy' }}
            </time>

            <p>
              Status:
              {{ project.status ? 'Complete' : 'InComplete' }}
            </p>
          </div>
          <div class="card-footer">
            <button class="btn btn-primary w-100" [routerLink]="['/task', project.id]">
              View Tasks
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</section>
